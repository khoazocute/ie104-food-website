<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thanh toán — Junk Food Shop</title>

  <!-- FAV ICON -->
  <link rel="shortcut icon" href="../assets/imgs/icon2.jpg" type="image/x-icon">

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Sigmar&display=swap"
    rel="stylesheet">

  <!-- FONT AWESOME -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/cart.css">
  <link rel="stylesheet" href="../assets/css/checkout.css">
</head>

<body>
  <div id="header-placeholder"></div>

  <main class="checkout-main">
    <div class="checkout-header">
      <h2>Thanh Toán Đơn Hàng</h2>
      <p>Hoàn tất thông tin để xác nhận đơn hàng của bạn</p>
    </div>

    <section class="checkout-grid">
      <div class="checkout-form">
        <h3>📋 Thông tin giao hàng</h3>
        <form id="checkoutForm">
          <div class="form-group">
            <label>Họ và tên <span style="color:red;">*</span></label>
            <input type="text" id="fullName" required placeholder="Nguyễn Văn A">
          </div>

          <div class="form-group">
            <label>Địa chỉ <span style="color:red;">*</span></label>
            <input type="text" id="address" required placeholder="123 Đường ABC, Quận 1, TP HCM">
          </div>

          <div class="form-group">
            <label>Số điện thoại <span style="color:red;">*</span></label>
            <input type="tel" id="phone" required placeholder="0988xxxxxx">
          </div>

          <div class="form-group">
            <label>Ghi chú (không bắt buộc)</label>
            <textarea id="note" rows="3" placeholder="Yêu cầu đặc biệt, hướng dẫn giao hàng..."></textarea>
          </div>

          <div style="margin-top: 24px;">
            <h3>💳 Phương thức thanh toán</h3>
            <div class="payment-methods">
              <div class="payment-option">
                <input type="radio" id="cod" name="payment" value="cod" checked>
                <label for="cod">Thanh toán khi nhận hàng (COD)</label>
              </div>
              <div class="payment-option">
                <input type="radio" id="bank" name="payment" value="bank">
                <label for="bank">Chuyển khoản ngân hàng</label>
              </div>
              <div class="payment-option">
                <input type="radio" id="momo" name="payment" value="momo">
                <label for="momo">Ví Momo</label>
              </div>
            </div>
          </div>

          <div class="checkout-btn-group">
            <button id="placeOrderBtn" type="button">Đặt hàng ✓</button>
          </div>
        </form>
      </div>

      <aside class="checkout-summary">
        <h3>📦 Tóm tắt đơn hàng</h3>
        <div id="summaryList">
        </div>
        <div class="checkout-total">
          <span class="checkout-total-label">Tổng cộng:</span>
          <span class="checkout-total-amount" id="summaryTotal">0 VND</span>
        </div>
      </aside>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="../assets/js/include.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/auth-guard.js"></script>
  <script src="../assets/js/order-history.js"></script>
  <script src="../assets/js/checkout.js"></script>
   
</body>

</html>
